name: UI smoke test

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instrumented:
    name: Launch app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM (hardware accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/ci_ui_test.sh

      - name: Assert the smoke tests really ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/outputs/androidTest-results/**/TEST-*.xml", recursive=True)
          total = failures = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
          print(f"{len(files)} result file(s): {total} tests, {failures} failures")
          sys.exit(0 if total > 0 and failures == 0 else 1)
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            gradle-test.log
            logcat.txt
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/ui-screenshot/**
          if-no-files-found: warn

      - name: Commit failure report
        if: failure()
        run: |
          {
            echo "# UI smoke test failure"
            echo
            echo "commit: ${GITHUB_SHA}"
            echo
            echo '```'
            tail -c 3000 gradle-test.log 2>/dev/null || echo "no gradle log"
            echo '```'
            echo '```'
            find app/build/outputs/androidTest-results -name 'TEST-*.xml' -exec sed -n '1,60p' {} \; 2>/dev/null || echo "no results"
            echo '```'
          } > ui-test-failure.md
          git config user.name "ci-report"
          git config user.email "ci@example.com"
          git add ui-test-failure.md
          git commit -m "CI: UI test failure report [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/93e79f18-hisnul-muslim || echo "push failed"
