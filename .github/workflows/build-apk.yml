name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Amharic content asset
        run: python3 tools/validate_asset.py

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (unsigned when no keystore secret is set)
        run: ./gradlew --no-daemon assembleRelease
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hisnul-muslim-amharic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hisnul-muslim-amharic-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
