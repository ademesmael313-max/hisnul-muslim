name: UI smoke test

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

jobs:
  instrumented:
    name: Launch app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -o pipefail -c "./gradlew --no-daemon connectedDebugAndroidTest --stacktrace 2>&1 | tee gradle-test.log"

      - name: Assert the smoke tests really ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/outputs/androidTest-results/**/TEST-*.xml", recursive=True)
          total = failures = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
          print(f"{len(files)} result file(s): {total} tests, {failures} failures")
          sys.exit(0 if total > 0 and failures == 0 else 1)
          PY

      - name: Publish failure details as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**UI smoke test failed** on \`${GITHUB_SHA}\`"
            echo
            echo '```'
            echo "--- gradle tail ---"
            tail -c 2500 gradle-test.log 2>/dev/null || echo "no gradle log"
            echo
            echo "--- test xml ---"
            find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null | while read -r f; do
              sed -n '1,120p' "$f"
            done
            echo '```'
          } > body.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@body.md >/dev/null 2>&1 || echo "could not post comment"
