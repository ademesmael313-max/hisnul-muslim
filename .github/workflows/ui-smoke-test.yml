name: UI smoke test

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  instrumented:
    name: Launch app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM (hardware accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/ci_ui_test.sh

      - name: Assert the smoke tests really ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/outputs/androidTest-results/**/TEST-*.xml", recursive=True)
          total = failures = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0)) + int(root.get("errors", 0))
          print(f"{len(files)} result file(s): {total} tests, {failures} failures")
          sys.exit(0 if total > 0 and failures == 0 else 1)
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            gradle-test.log
            logcat.txt
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Publish screenshot to the repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          out=/tmp/hisnul_shot
          ls -la "$out" || true
          target_branch="${GITHUB_REF_NAME}"
          put_file() {
            content=$(base64 -w0 "$2")
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${target_branch}" -q .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="$3 [skip ci]" -f content="$content" -f sha="$sha" -f branch="${target_branch}" >/dev/null
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" \
                -f message="$3 [skip ci]" -f content="$content" -f branch="${target_branch}" >/dev/null
            fi
          }
          if [ -s "$out/home.png" ]; then
            put_file "docs/screenshots/home.png" "$out/home.png" "Add home screen screenshot" && echo "published png"
          else
            echo "no screenshot; publishing status"
            if [ -s "$out/status.txt" ]; then
              put_file "docs/screenshots/CI-STATUS.txt" "$out/status.txt" "CI: screenshot status" || echo "status upload failed"
            else
              printf 'no screenshot and no status file\n' > /tmp/s.txt
              put_file "docs/screenshots/CI-STATUS.txt" "/tmp/s.txt" "CI: screenshot status" || echo "fallback upload failed"
            fi
          fi
